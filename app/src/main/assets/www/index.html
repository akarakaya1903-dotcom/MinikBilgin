<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>
/* Android uygulamasında sesli okuma: telefonun kendi Text-to-Speech motorunu kullanır */
if(window.AndroidTTS){window.SpeechSynthesisUtterance=function(t){this.text=t;this.lang="en-US";this.rate=1};
 Object.defineProperty(window,"speechSynthesis",{configurable:true,value:{speak:function(u){AndroidTTS.speak(String(u.text),u.lang||"en-US",u.rate||1)},cancel:function(){AndroidTTS.stop()}}});}
</script>
<title>Minik Bilgin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: renkli ders blokları + günlük görev şeridi; telefon, tablet ve TV kumandasıyla gezilebilir tek sayfa */
:root{
  --bg:#EAF1F5; --surface:#FFFFFF; --soft:#F4F8FB; --ink:#13233B; --muted:#56667D; --line:#CBD8E3;
  --math:#2563D9; --tr:#DB4430; --en:#6B45D6; --bil:#C0397A; --din:#13805D; --zeka:#E08E0B; --goz:#0B93A8; --plan:#3A4862;
  --good:#1E9A55; --bad:#D23B3B; --star:#E9A80F;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --arabic:"Amiri","Traditional Arabic","Geeza Pro",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1520; --surface:#162236; --soft:#1B2A42; --ink:#EAF1F8; --muted:#A3B2C6; --line:#2B3A55;
  --math:#4B82F0; --tr:#EE6450; --en:#8C6CF2; --bil:#E05A9A; --din:#26A47C; --zeka:#F0A52A; --goz:#22B3C9; --plan:#5A6C8C;
  --good:#38B86F; --bad:#EE5B5B; --star:#F6C443; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1520; --surface:#162236; --soft:#1B2A42; --ink:#EAF1F8; --muted:#A3B2C6; --line:#2B3A55;
  --math:#4B82F0; --tr:#EE6450; --en:#8C6CF2; --bil:#E05A9A; --din:#26A47C; --zeka:#F0A52A; --goz:#22B3C9; --plan:#5A6C8C;
  --good:#38B86F; --bad:#EE5B5B; --star:#F6C443; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:5px solid var(--star);outline-offset:3px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:54px;height:54px;border-radius:18px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.02em}
.brand h1{font-size:34px}
.brand small{display:block;color:var(--muted);font-size:14px;font-weight:700;letter-spacing:.04em}
.kids{display:flex;gap:8px;flex-wrap:wrap}
.kid{display:grid;grid-template-columns:auto auto;column-gap:10px;align-items:center;padding:8px 16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-weight:800;line-height:1.2}
.kid .kid-n{font-family:var(--display);font-size:20px}
.kid .kid-g{grid-row:2;font-size:13px;color:var(--muted)}
.kid .star{grid-row:span 2;font-size:18px}
.kid[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.kid[aria-pressed="true"] .kid-g{color:inherit;opacity:.75}
.star{color:var(--star);font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h2{font-size:clamp(26px,4vw,34px);flex:1;min-width:0}
.back{width:52px;height:52px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:24px;display:grid;place-items:center}
.hello{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:20px 24px}
.hello h2{font-size:clamp(26px,4vw,36px)}
.hello p{color:var(--muted);font-weight:600;margin-top:4px}
.ring{--p:0;flex:none;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--surface)}
.ring b,.ring span{position:relative;grid-area:1/1;line-height:1}
.ring b{font-family:var(--display);font-size:26px;margin-top:-12px}
.ring span{font-size:12px;font-weight:800;color:var(--muted);margin-top:26px}
.gh{font-size:22px;margin:0 0 10px}
.grp{display:flex;flex-direction:column}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mission{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:20px;background:var(--surface);border:2px solid var(--line);border-top:8px solid var(--k);min-height:118px}
.mission .mt{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--k)}
.mission b{font-family:var(--display);font-size:19px;line-height:1.15;flex:1}
.mission .mc2{font-size:14px;font-weight:800;color:var(--muted)}
.mission.done{background:color-mix(in srgb,var(--good) 12%,var(--surface));border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.mission.done .mc2{color:var(--good)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{position:relative;min-height:160px;border-radius:28px;padding:18px 20px;background:var(--k);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile .glyph{position:absolute;top:8px;right:16px;font-family:var(--display);font-weight:800;font-size:60px;line-height:1;opacity:.32}
.tile .glyph.ar{font-family:var(--arabic);font-size:70px}
.tile b{font-family:var(--display);font-size:28px;line-height:1.1}
.tile span:last-child{font-size:15px;font-weight:700;opacity:.93}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item{position:relative;padding:16px 18px;border-radius:20px;background:var(--surface);border:2px solid var(--line);border-left:7px solid var(--k);display:flex;flex-direction:column;gap:2px;min-height:86px}
.item b{font-family:var(--display);font-size:21px;line-height:1.2}
.item span{color:var(--muted);font-size:15px;font-weight:600}
.item .bg{font-size:22px}
.item.quizitem{background:color-mix(in srgb,var(--k) 8%,var(--surface))}
.tick{position:absolute;top:10px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--good);color:#fff!important;display:grid;place-items:center;font-size:15px!important;font-weight:800!important}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h3{font-size:24px}
.tag{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{color:var(--muted);font-size:16px;max-width:75ch}
.center{text-align:center;margin:0 auto}
.text{max-width:70ch;display:flex;flex-direction:column;gap:12px}
.lesson .text{font-size:19px}
.ex{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:4px 16px;padding:12px 16px;border-radius:14px;background:var(--soft);align-items:center;width:100%}
.ex span{font-family:var(--display);font-weight:700;font-size:20px}
.ex b{font-weight:600}
.exb{cursor:pointer}
@media (max-width:560px){.ex{grid-template-columns:1fr}}
.pv{display:flex;gap:10px;flex-wrap:wrap}
.pv div{display:flex;flex-direction:column;align-items:center;padding:10px 18px;border-radius:14px;border:2px solid var(--math);min-width:84px}
.pv span{font-size:13px;font-weight:800;color:var(--muted)}
.pv b{font-family:var(--display);font-size:40px;color:var(--math);line-height:1.1}
.calc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;line-height:1.3;background:var(--soft);padding:12px 22px;border-radius:14px;margin:0;width:max-content;max-width:100%;overflow-x:auto}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.figrow{display:flex;gap:12px;flex-wrap:wrap}
.figrow svg{width:min(150px,28vw);height:auto}
.abc{display:flex;flex-wrap:wrap;gap:6px}
.abc span{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;background:var(--soft);border:2px solid var(--line)}
.abc span.v{background:var(--tr);color:#fff;border-color:var(--tr)}
.sticky-act{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:3}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-weight:800;flex-wrap:wrap}
.fire{color:var(--tr)}
.prog{height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--k,var(--math));transition:width .3s}
.question{font-family:var(--display);font-size:clamp(28px,5vw,46px);font-weight:800;text-align:center;line-height:1.2;text-wrap:balance}
.question.small{font-size:clamp(21px,3.4vw,30px);font-weight:700}
.question .ar,.ar{font-family:var(--arabic);font-weight:400}
.question .ar{font-size:clamp(80px,14vw,120px);line-height:1.3}
.question u{text-decoration:none;display:inline-block;min-width:2.4em;border-bottom:4px solid var(--k);color:var(--k)}
.seq{font-size:clamp(30px,6vw,46px);letter-spacing:.06em}
.qpic{display:flex;justify-content:center}
.qpic svg.fig{width:min(220px,60vw);height:auto}
.qpic svg.wide{width:min(400px,100%)}
.qpic svg.clock{width:min(240px,62vw);height:auto}
.pic{font-size:clamp(70px,14vw,104px);text-align:center;line-height:1.1}
.pic.num{font-family:var(--display);font-weight:800;color:var(--en)}
.swatch{width:120px;height:120px;border-radius:50%;margin:0 auto;border:4px solid var(--line)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.long{grid-template-columns:1fr}
.opt{padding:16px 12px;border-radius:18px;border:3px solid var(--line);background:var(--soft);font-family:var(--display);font-weight:800;font-size:clamp(22px,3.4vw,32px);min-height:74px;text-align:center;line-height:1.2}
.opts.long .opt{font-size:clamp(18px,2.6vw,23px);font-weight:700;text-align:left;padding:14px 18px;min-height:60px}
.opt.ar-o{font-family:var(--arabic);font-size:44px;font-weight:400}
.opt:hover{border-color:var(--k)}
.opt.ok{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.feedback{text-align:center;font-weight:800;min-height:1.6em;font-size:20px}
.feedback span{font-weight:600;font-size:17px;color:var(--muted)}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{padding:14px 24px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:800;font-size:18px;text-align:center}
.btn.big{font-size:20px;padding:16px 28px;color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:15px}
.result{text-align:center;align-items:center}
.result .score{font-family:var(--display);font-size:80px;font-weight:800;line-height:1}
.result .score small{font-size:36px;color:var(--muted)}
.medal{font-size:56px;line-height:1}
.review{width:100%;max-width:640px;text-align:left;background:var(--soft);border-radius:16px;padding:12px 16px}
.review summary{font-weight:800;cursor:pointer}
.review ul{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.review b{color:var(--good)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card2{background:var(--surface);border:2px solid var(--line);border-top:6px solid var(--k);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card2 h4{font-size:21px}
.card2 .okunus{font-weight:700;font-size:18px}
.card2.flip .ans{color:var(--k);font-size:20px}
.big-p{font-size:20px;font-weight:600;line-height:1.55}
.spk{font-size:16px}
.quote .src{font-size:14px;font-weight:800;color:var(--muted)}
.lesson-line{background:var(--soft);padding:8px 12px;border-radius:12px;font-size:16px}
.meal{color:var(--muted);border-left:4px solid var(--din);padding-left:14px}
.okunus{line-height:1.7}
.fcard{min-height:280px;width:100%;border-radius:26px;background:var(--soft);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.fcard .big{font-family:var(--display);font-size:clamp(40px,7vw,64px);font-weight:800;line-height:1}
.fcard .sub{color:var(--muted);font-size:24px;font-weight:700}
.ar-big{font-family:var(--arabic);font-size:clamp(110px,18vw,160px);line-height:1.25}
.hrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;direction:rtl}
.hcell{display:flex;flex-direction:column;align-items:center;padding:10px;border-radius:16px;background:var(--soft);direction:ltr}
.hcell .ar{font-size:56px;line-height:1.4}
.hcell b{font-family:var(--display);font-size:24px}
.hcell small{color:var(--muted);font-weight:700}
.hx{display:flex;align-items:center;gap:14px}
.hx .ar{font-size:44px}
.hx b{font-family:var(--display);font-size:26px}
.card2 h4 .ar{font-size:34px}
.syl{min-width:420px}
.syl .ar{font-size:30px}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;direction:rtl}
.letter{aspect-ratio:1;border-radius:18px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}
.letter .a{font-family:var(--arabic);font-size:46px;line-height:1.15}
.letter .n{font-size:14px;font-weight:800;color:var(--muted);direction:ltr}
.arabic{font-family:var(--arabic);font-size:clamp(28px,4.4vw,40px);line-height:2.1;direction:rtl;text-align:center}
.ayet{margin:0;padding-left:28px;display:flex;flex-direction:column;gap:6px}
.ayet li::marker{font-weight:800;color:var(--din)}
.ayl{font-size:20px;font-weight:600;line-height:1.6;padding:4px 8px;border-radius:10px;width:100%}
.ayl.hide{color:transparent;background:var(--soft);text-shadow:0 0 14px color-mix(in srgb,var(--ink) 50%,transparent)}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.nlist{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:6px;font-weight:600}
.nlist.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 20px}
.nlist li::marker{color:var(--muted);font-weight:800}
.stepcards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.stepcards li{display:flex;gap:12px;padding:14px;border-radius:18px;background:var(--surface);border:2px solid var(--line)}
.stepcards li.farz{border-color:var(--din);background:color-mix(in srgb,var(--din) 9%,var(--surface))}
.stepcards .sn{flex:none;width:38px;height:38px;border-radius:50%;background:var(--din);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.stepcards p{font-size:16px;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:4px solid var(--din);display:flex;flex-direction:column;gap:12px}
.timeline li{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;gap:14px;align-items:baseline}
.timeline li::before{content:"";position:absolute;left:-29px;top:18px;width:16px;height:16px;border-radius:50%;background:var(--din);border:3px solid var(--bg)}
.timeline .yr{font-family:var(--display);font-weight:800;font-size:24px;color:var(--din);font-variant-numeric:tabular-nums;min-width:56px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:16px}
th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}
th{font-family:var(--display);font-size:18px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.chipbtn{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800}
.chipbtn[aria-pressed="true"]{background:var(--math);color:#fff;border-color:var(--math)}
.ttable{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.ttable div{display:flex;justify-content:space-between;padding:10px 16px;border-radius:12px;background:var(--soft);font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.ttable b{color:var(--math)}
.money{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.note-b{padding:16px 18px;border-radius:8px;background:var(--mc);color:#fff;font-family:var(--display);font-weight:800;font-size:22px;min-width:96px;text-align:center;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.coin{width:74px;height:74px;border-radius:50%;background:var(--mc);color:#1b1b1b;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.45)}
.abcgrid,.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.abcc,.wcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px;border-radius:18px;background:var(--surface);border:2px solid var(--line);text-align:center}
.abcc b{font-family:var(--display);font-size:34px;color:var(--en);line-height:1}
.abcc .e,.wcell .pic{font-size:42px}
.wcell .swatch{width:56px;height:56px}
.wcell .pic.num{font-size:40px}
.abcc small,.wcell span{color:var(--muted);font-weight:700;font-size:14px}
.wcell b{font-family:var(--display);font-size:20px}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:78%;padding:12px 16px;border-radius:18px 18px 18px 4px;background:var(--soft);border:2px solid var(--line);display:flex;flex-direction:column;gap:2px}
.bub.r{align-self:flex-end;border-radius:18px 18px 4px 18px;background:color-mix(in srgb,var(--en) 12%,var(--surface))}
.bub .who{font-size:13px;font-weight:800;color:var(--en);text-transform:uppercase;letter-spacing:.06em}
.bub b{font-size:20px}
.bub span:last-child{color:var(--muted);font-size:16px}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:560px;margin:0 auto;width:100%}
.mc{aspect-ratio:1;border-radius:16px;background:var(--zeka);display:grid;place-items:center;font-size:clamp(30px,8vw,52px)}
.mc span{visibility:hidden}
.mc.open,.mc.done{background:var(--soft);border:3px solid var(--line)}
.mc.open span,.mc.done span{visibility:visible}
.mc.done{border-color:var(--good)}
.winbox{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px;border-radius:18px;background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good);text-align:center;margin-top:10px}
.winbox b{font-family:var(--display);font-size:24px}
.winbox span{font-weight:800}
.simon{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:380px;margin:0 auto;width:100%}
.sp{aspect-ratio:1;border-radius:28px;background:var(--c);opacity:.45;transition:opacity .12s,transform .12s}

.sc.got{background:var(--goz);color:#fff;border-color:var(--goz)}
.sc.miss,.fdc.miss{background:color-mix(in srgb,var(--bad) 30%,var(--soft))}
.fd{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;max-width:520px;margin:0 auto;width:100%}

.fdc.got{background:var(--good)}
.eye-stage{position:relative;height:min(55vh,440px);border-radius:26px;background:var(--soft);border:3px solid var(--line);overflow:hidden}
.dot{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--goz);box-shadow:0 0 0 8px color-mix(in srgb,var(--goz) 25%,transparent)}
.eye-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;font-family:var(--display);font-size:clamp(22px,3.6vw,32px);font-weight:700;overflow:auto}
.count{font-size:64px;color:var(--goz)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stats div{display:flex;flex-direction:column;align-items:center;padding:12px;border-radius:16px;background:var(--soft)}
.stats b{font-family:var(--display);font-size:36px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-weight:700;font-size:14px}
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:100px 1fr 52px 64px;gap:10px;align-items:center}
.brow span{font-weight:800}.brow small{color:var(--muted);font-variant-numeric:tabular-nums}
.bt{height:16px;border-radius:9px;background:var(--line);overflow:hidden}.bt i{display:block;height:100%}

.week b{font-variant-numeric:tabular-nums}.week span{font-size:13px;color:var(--muted);font-weight:800}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 10px;border-radius:18px;background:var(--soft);opacity:.45;filter:grayscale(1)}

.badge span{font-size:38px}.badge b{font-family:var(--display);font-size:18px}.badge small{color:var(--muted);font-weight:700}
